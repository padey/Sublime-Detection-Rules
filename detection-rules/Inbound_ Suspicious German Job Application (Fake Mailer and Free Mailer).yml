source: "type.inbound\r\nand (\r\n  strings.ilike(headers.mailer,\r\n                \"Microsoft
  CDO for Windows 2000\",\r\n                \"PHPMailer*\",\r\n                \"nodemailer*\",\r\n
  \               \"Python-urllib*\",\r\n                \"GuzzleHttp*\"\r\n  )\r\n)\r\nand
  (\r\n  sender.email.domain.domain in $free_email_providers\r\n  or sender.email.domain.root_domain
  in ('firemail.de', 'web.de', 'gmx.de')\r\n)\r\nand any(attachments,\r\n  (\r\n    .file_extension
  == \"pdf\" \r\n    or .file_type == \"pdf\"\r\n  )\r\n  and (\r\n    strings.ilike(.file_name,
  \"*Lebenslauf*\", \"*Zeugnis*\", \"*Bewerbung*\", \"*CV*\")\r\n  )\r\n)\r\n// Sicherstellen,
  dass wir keine Historie mit dem Absender haben\r\nand not profile.by_sender().any_messages_benign\r\nand
  not profile.by_sender().solicited"
type: rule
name: 'Inbound: Suspicious German Job Application (Fake Mailer & Free Mailer)'
authors:
- name: Patrick Stanullo
description: |-
  This rule detects automated malicious email campaigns disguised as German job
  applications ("Bewerbungen"). These campaigns frequently exploit free email providers
  (specifically highlighting firemail.de, web.de, and gmx.de) and are dispatched via
  programmatic mailers like PHPMailer or nodemailer, as documented in recent German
  "Bewerbungsflut" (application flood) malware trends. It identifies incoming messages
  containing PDF attachments with recruitment-related keywords (e.g., Lebenslauf,
  Zeugnisse) from senders with no prior benign interaction history. This pattern is often
  used to distribute malware loaders or initiate social engineering attacks.
references: []
tags:
- Callback Phishing
- Phishing
- Malware
- Initial Access
- German Language
severity: high
