name: "Suspicious German Job Application (Fake Mailer & Free Mailer)"
description: |
  This rule detects automated malicious email campaigns disguised as German job applications ("Bewerbungen"). 
  These campaigns frequently exploit free email providers (specifically highlighting firemail.de, web.de, and gmx.de) 
  and are dispatched via programmatic mailers like PHPMailer or nodemailer, as documented in recent German 
  "Bewerbungsflut" (application flood) malware trends. It identifies incoming messages containing PDF 
  attachments with recruitment-related keywords (e.g., Lebenslauf, Zeugnisse) from senders with no prior 
  benign interaction history.
type: "rule"
severity: "high"
authors:
  - name: "affjex065"
references:
  - "https://www.keppler-it.de/blog/2024-01-bewerbungsflut/"
  - "https://www.antispam-ev.de/forum/showthread.php?43358-Initiativbewerbung-als-Nennung-verschiedener-Berufe"
  - "https://github.com/padey/Sublime-Detection-Rules/tree/main/detection-rules"
source: |
  type.inbound
  and (
    strings.ilike(headers.mailer,
                  "Microsoft CDO for Windows 2000",
                  "PHPMailer*",
                  "nodemailer*",
                  "Python-urllib*",
                  "GuzzleHttp*"
    )
  )
  and (
    sender.email.domain.domain in $free_email_providers
    or sender.email.domain.root_domain in ('firemail.de', 'web.de', 'gmx.de')
  )
  and any(attachments,
    (
      .file_extension == "pdf" 
      or .file_type == "pdf"
    )
    and (
      strings.ilike(.file_name, "*Lebenslauf*", "*Zeugnis*", "*Bewerbung*", "*CV*")
    )
  )
  // Ensure no prior history with the sender
  and not profile.by_sender().any_messages_benign
  and not profile.by_sender().solicited
tags:
  - "Phishing"
  - "Malware"
  - "Initial Access"
  - "German Language"
attack_types:
  - "Malware/Ransomware"
tactics_and_techniques:
  - "Evasion"
  - "PDF"
  - "Social Engineering"
detection_methods:
  - "File analysis"
  - "Header analysis"
  - "Sender analysis"
